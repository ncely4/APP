<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ParkApp · AUSACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#F7F9FC; --ink:#142235; --muted:#56667C; --line:#D8E0EA;
  --brand:#1D4F91; --brand-strong:#0E2F5C; --brand-soft:#E2EBF7; --brand-ink:#FFFFFF;
  --s1:#0E2F5C; --s2:#1D4F91; --s3:#3B7DD8; --s4:#7FAEEA; --s5:#BCD3F2;
  --ok:#23734A; --ok-soft:#E3F3EA; --warn:#9A5B00; --warn-soft:#FDF1DC; --danger:#B42323; --danger-soft:#FBE6E6; --orange:#B8500E; --orange-soft:#FCEADB;
  --plate:#F6C700; --plate-ink:#111111;
  --radius:10px;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --plate-font:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1422; --surface:#121E31; --surface-2:#172740; --ink:#E6EDF7; --muted:#9AAAC0; --line:#26384F;
    --brand:#4F8BE0; --brand-strong:#0A1A31; --brand-soft:#1B3150; --brand-ink:#FFFFFF;
    --s1:#BCD3F2; --s2:#7FAEEA; --s3:#4F8BE0; --s4:#2E64B0; --s5:#1D4478;
    --ok:#5BC48A; --ok-soft:#133224; --warn:#F0B454; --warn-soft:#3A2B10; --danger:#F07474; --danger-soft:#3A1717; --orange:#F2995A; --orange-soft:#3A2312;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1422; --surface:#121E31; --surface-2:#172740; --ink:#E6EDF7; --muted:#9AAAC0; --line:#26384F;
  --brand:#4F8BE0; --brand-strong:#0A1A31; --brand-soft:#1B3150; --brand-ink:#FFFFFF;
  --s1:#BCD3F2; --s2:#7FAEEA; --s3:#4F8BE0; --s4:#2E64B0; --s5:#1D4478;
  --ok:#5BC48A; --ok-soft:#133224; --warn:#F0B454; --warn-soft:#3A2B10; --danger:#F07474; --danger-soft:#3A1717; --orange:#F2995A; --orange-soft:#3A2312;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--s3);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:650}
h3{font-size:.98rem;font-weight:650}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

/* Layout */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--brand-strong);color:#DCE7F5;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:38px;height:38px;border-radius:8px;background:#fff;color:var(--brand-strong);display:grid;place-items:center;font:700 1.25rem var(--plate-font)}
.brand b{display:block;color:#fff;font-size:1.05rem}
.brand span{font-size:.78rem;color:#9FB6D4}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:#C9D8EC;font-size:.93rem}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current="page"]{background:#fff;color:var(--brand-strong);font-weight:600}
.nav button:focus-visible{outline:3px solid #7FAEEA}
.side-foot{margin-top:auto;font-size:.8rem;color:#9FB6D4;padding:0 8px;display:flex;flex-direction:column;gap:8px}
.side-foot select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:5px 6px;width:100%}
.side-foot select option{color:#111}
.side-foot button{all:unset;cursor:pointer;color:#C9D8EC;text-decoration:underline}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0}
.bottom{display:none}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:18px 14px 96px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--brand-strong);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;z-index:30}
  .bottom button{all:unset;flex:1;text-align:center;color:#C9D8EC;font-size:.74rem;padding:8px 2px;border-radius:8px;cursor:pointer}
  .bottom button[aria-current="page"]{background:#fff;color:var(--brand-strong);font-weight:600}
  .mobile-top{display:flex !important}
}
.mobile-top{display:none;align-items:center;justify-content:space-between;margin-bottom:12px}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel + .panel{margin-top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .v{font-size:1.65rem;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.84rem;color:var(--muted)}
.kpi .d{font-size:.8rem;margin-top:2px}
.scroll{overflow-x:auto}

/* Tables */
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;font-size:.9rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--s3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn.big{padding:16px 22px;font-size:1.05rem;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--brand);font-weight:550;font-size:.86rem}
.link:hover{text-decoration:underline}
.link.danger{color:var(--danger)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters > *{flex:1 1 150px;max-width:260px}
.filters .grow{flex:2 1 220px;max-width:none}
input[type=text],input[type=password],input[type=number],input[type=email],input[type=tel],input[type=month],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:38px}
textarea{min-height:76px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:550}
label.f .hint{font-weight:400;color:var(--muted);font-size:.78rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem}

/* Badges */
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--brand-soft);color:var(--brand)}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.danger{background:var(--danger-soft);color:var(--danger)}
.b.orange{background:var(--orange-soft);color:var(--orange)}
.b.gray{background:var(--surface-2);color:var(--muted)}

/* Plate: Colombian yellow plate */
.plate{display:inline-flex;align-items:center;justify-content:center;background:var(--plate);color:var(--plate-ink);border:2px solid #111;border-radius:5px;font:700 1rem/1 var(--plate-font);letter-spacing:.08em;padding:3px 7px 2px;min-width:74px;box-shadow:inset 0 0 0 1.5px var(--plate)}
.plate.xl{font-size:clamp(3rem,13vw,5.4rem);padding:14px 26px 8px;border-width:4px;border-radius:12px;letter-spacing:.1em;min-width:0;position:relative}
.plate.xl::after{content:"COLOMBIA";position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:.14em;letter-spacing:.3em}
input.plate-input{font:700 clamp(2.4rem,10vw,4rem)/1 var(--plate-font);letter-spacing:.1em;text-align:center;background:var(--plate);color:#111;border:4px solid #111;border-radius:12px;padding:10px;text-transform:uppercase;max-width:360px}

/* Scanner */
.scan{max-width:720px}
.scan-actions{display:flex;gap:10px;flex-wrap:wrap}
.preview{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);max-width:420px;background:#000}
.preview img{display:block;width:100%;height:auto;max-height:320px;object-fit:contain}
.verdict{border-radius:14px;padding:22px;margin-top:16px;border:2px solid}
.verdict h2{font-size:clamp(1.4rem,5vw,2.1rem);font-weight:800;letter-spacing:-.01em}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.verdict.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.verdict.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.verdict.orange{background:var(--orange-soft);border-color:var(--orange);color:var(--orange)}
.verdict dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;color:var(--ink)}
.verdict dt{color:var(--muted)}
.verdict dd{margin:0;font-weight:600}
.notice{font-size:.8rem;color:var(--muted);border-left:3px solid var(--s4);padding:6px 10px;margin-top:16px;background:var(--surface-2);border-radius:0 6px 6px 0}
.progress{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted)}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}

/* Charts */
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;margin-top:8px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bars .row{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:8px;margin:6px 0;font-size:.85rem}
.bars .track{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden;display:flex}
.light{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}

/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(8,18,34,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);padding:22px;border:1px solid var(--line)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.err{color:var(--danger);font-size:.86rem;font-weight:550;margin-top:10px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.88rem;margin-top:10px}
.infobox{background:var(--brand-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.88rem;margin-top:10px}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
@media (max-width:820px){.toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px));left:12px;right:12px}}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:.9rem;max-width:420px}
.toast.error{background:var(--danger);color:#fff}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.3s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.85rem;color:var(--muted)}
.queue-first td{background:var(--brand-soft)}
.locked .shell{grid-template-columns:1fr}
.locked .side,.locked .bottom{display:none !important}
.locked main{display:grid;justify-items:center;align-content:start;padding-top:max(6vh,24px)}
.auth{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.auth-brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}
.auth-brand .brand-mark{background:var(--brand-strong);color:#fff}
.auth-brand b{display:block;font-size:1.05rem}
.auth h1{margin-bottom:6px}
.auth-form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.auth-form .btn.big{justify-content:center}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;max-width:720px;margin:0 auto}
.cam video{display:block;width:100%;height:auto}
.cam-guia{position:absolute;left:7.5%;width:85%;aspect-ratio:2.2/1;top:50%;transform:translateY(-50%);border:3px solid var(--plate);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.4);pointer-events:none}
.cam-msg{position:absolute;inset:auto 0 12px;text-align:center;color:#fff;font-size:.9rem;text-shadow:0 1px 3px #000;pointer-events:none}
.cam-flash{animation:flash .35s ease-out}
@keyframes flash{from{box-shadow:inset 0 0 0 9999px rgba(255,255,255,.8)}to{box-shadow:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Menú principal">
    <div class="brand"><div class="brand-mark" aria-hidden="true">P</div><div><b>ParkApp</b><span>AUSACE · Zona G, lotes 12–15</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main id="main"><div class="panel"><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:40%"></div></div></main>
</div>
<nav class="bottom" id="bottom" aria-label="Menú"></nav>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
"use strict";
/* ================= Estado ================= */
const COLS = ["cupos","visitas","solicitudes","pagos","movimientos","lecturas","alertas","notificaciones","cuentas","registros","accesos"];
const DEF = {
  total_cupos:90, total_cupos_rotativos:10,
  cuota_fijo:50000, cuota_segundo_cupo:50000, cuota_rotativo:30000,
  max_cupos_por_apto:2,
  umbral_visitas_30d:3, umbral_recrear_dias:7, umbral_mora_ingreso_dias:7,
  anillos:[{anillo:12,num_apartamentos:34,comentarios:""},{anillo:13,num_apartamentos:30,comentarios:""},{anillo:14,num_apartamentos:25,comentarios:""},{anillo:15,num_apartamentos:20,comentarios:""}],
  plantilla_recordatorio:"Hola {nombre}. Le recordamos que la cuota del parqueadero (placa {placa}) de este mes es de {valor}. Gracias. Administración AUSACE.",
  plantilla_mora:"Hola {nombre}. El cupo de parqueadero de la placa {placa} registra {meses} mes(es) sin pago, por un total de {valor}. Por favor póngase al día con la administración. AUSACE.",
  plantilla_turno:"Hola {nombre}. Le informamos que se le asignó un cupo rotativo para la placa {placa}. Administración AUSACE.",
  ultimo_analisis:null
};
const S = { auth:{estado:"cargando",cuenta:null,msg:"",info:""}, config:{...DEF}, loaded:new Set(), view:null, f:{}, page:{}, me:{id:null,isOwner:false}, verComo:null, verComoApto:null, names:{} };
COLS.forEach(c => S[c] = []);
let db=null, user=null, sample=null, downloads=null, sampleImages=false, canWrite=true;

/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowISO = () => new Date().toISOString();
const hoyBogota = () => new Intl.DateTimeFormat("en-CA",{timeZone:"America/Bogota",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const periodoActual = () => hoyBogota().slice(0,7);
function periodoMas(p,n){ let [y,m]=p.split("-").map(Number); m+=n; while(m<=0){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${String(m).padStart(2,"0")}`; }
function mesesEntre(a,b){ const [ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number); return (yb-ya)*12+(mb-ma); }
const fmtFecha = iso => { if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return "—"; return new Intl.DateTimeFormat("es-CO",{timeZone:"America/Bogota",day:"2-digit",month:"2-digit",year:"numeric"}).format(d); };
const fmtFechaHora = iso => { if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return "—"; return new Intl.DateTimeFormat("es-CO",{timeZone:"America/Bogota",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(d); };
const fmtPeriodo = p => { if(!p) return "—"; const [y,m]=p.split("-"); const n=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+m-1]; return `${n} ${y}`; };
const money = n => "$" + Math.round(Number(n)||0).toLocaleString("es-CO");
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const diasDesde = iso => Math.floor((Date.now()-new Date(iso).getTime())/86400000);
const normPlaca = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const normTxt = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
function formatoPlaca(p){ if(/^[A-Z]{3}\d{3}$/.test(p)) return "CARRO"; if(/^[A-Z]{3}\d{2}[A-Z]$/.test(p)) return "MOTO"; if(/^[A-Z]{3}\d{2}$/.test(p)) return "MOTO ANTIGUA"; return null; }
const plate = p => `<span class="plate">${esc(p||"—")}</span>`;
const telValido = t => /^3\d{9}$/.test(String(t||""));
const aptoKey = c => `${c.anillo}-${c.apto}`;

function corregirPlaca(raw, tipoVeh){
  const A={"0":"O","1":"I","8":"B","5":"S"}, N={"O":"0","I":"1","B":"8","S":"5"};
  const ch = normPlaca(raw).split("");
  for(let i=0;i<Math.min(3,ch.length);i++) if(A[ch[i]]) ch[i]=A[ch[i]];
  for(let i=3;i<Math.min(5,ch.length);i++) if(N[ch[i]]) ch[i]=N[ch[i]];
  if(ch.length===6){ if(tipoVeh==="CARRO" && N[ch[5]]) ch[5]=N[ch[5]]; if(tipoVeh==="MOTO" && A[ch[5]]) ch[5]=A[ch[5]]; }
  return ch.join("");
}
function cuotaDe(tipo){ const c=S.config; return tipo==="FIJO"?c.cuota_fijo : tipo==="SEGUNDO CUPO"?c.cuota_segundo_cupo : tipo==="ROTATIVO"?c.cuota_rotativo : 0; }
function estadoPago(c){
  if(c.estado!=="ACTIVO" || !(Number(c.cuota_mensual)>0)) return "NO_APLICA";
  const cur=periodoActual(); const u=c.ultimo_periodo_pagado;
  if(u && u>=cur) return "AL_DIA";
  if(u && u===periodoMas(cur,-1)) return "PENDIENTE";
  if(!u){ const reg=(c.fecha_registro||nowISO()).slice(0,7); if(reg>=cur) return "PENDIENTE"; }
  return "MOROSO";
}
function deuda(c){
  if(estadoPago(c)==="NO_APLICA"||estadoPago(c)==="AL_DIA") return {meses:0,valor:0};
  const cur=periodoActual(); const desde = c.ultimo_periodo_pagado ? periodoMas(c.ultimo_periodo_pagado,1) : (c.fecha_registro||nowISO()).slice(0,7);
  const meses = Math.max(1, mesesEntre(desde,cur)+1);
  return {meses, valor: meses*(Number(c.cuota_mensual)||0)};
}

/* Método del residuo mayor (Hamilton) */
function hamilton(){
  const an=anillosCfg(); const total=an.reduce((s,a)=>s+Number(a.num_apartamentos||0),0);
  const cupos=Math.max(0, Number(S.config.total_cupos||0)-Number(S.config.total_cupos_rotativos||0));
  const rows=an.map(a=>{ const ex= total? Number(a.num_apartamentos)/total*cupos : 0; return {anillo:a.anillo, aptos:Number(a.num_apartamentos), exacto:ex, base:Math.floor(ex), resto:ex-Math.floor(ex)}; });
  let sobra=cupos-rows.reduce((s,r)=>s+r.base,0);
  rows.slice().sort((a,b)=>b.resto-a.resto).forEach(r=>{ if(sobra>0){ r.base++; sobra--; } });
  const res={}; rows.forEach(r=>res[r.anillo]={...r, equitativo:r.base});
  return res;
}

const SES_MIN=30, MAX_INTENTOS=5, BLOQUEO_MIN=5, ITER=150000, SES_KEY="parkapp-sesion";

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derivar(pass, salt, iter){ const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]); return b64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:unb64(salt),iterations:iter},k,256)); }
async function hashNuevo(pass){ const salt=b64(crypto.getRandomValues(new Uint8Array(16))); return {hash:await derivar(pass,salt,ITER),salt,iteraciones:ITER,algoritmo:"PBKDF2-SHA256"}; }
const claveValida=p=>p.length>=8 && /[A-Za-zÁÉÍÓÚáéíóúÑñ]/.test(p) && /\d/.test(p);
const normCorreo=c=>String(c||"").trim().toLowerCase();
const correoValido=c=>/^[a-z0-9._+\-]+@[a-z0-9\-]+(\.[a-z0-9\-]+)*\.[a-z]{2,}$/.test(c) && c.length<=120;
function claveTemporal(){ const L="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz", D="23456789"; const r=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n; let s=""; for(let i=0;i<6;i++) s+=L[r(L.length)]; for(let i=0;i<4;i++) s+=D[r(D.length)]; return s; }

async function iniciarSesion(F){
  const correo=normCorreo(F.correo.value), clave=F.p1.value;
  if(!correo || !clave) throw uerr("Escribe tu correo y tu contraseña.");
  if(!correoValido(correo)) throw uerr("Correo o contraseña incorrectos.");
  const iRef=db.doc("intentos/"+correo); let it={}; try{ const x=await iRef.get(); it=x.exists?x.data():{}; }catch(_){}
  if(it.bloqueado_hasta && Date.now()<Date.parse(it.bloqueado_hasta)) throw uerr(`Demasiados intentos fallidos. Espera ${Math.ceil((Date.parse(it.bloqueado_hasta)-Date.now())/60000)} minuto(s) e inténtalo de nuevo.`);
  const d=await db.doc("cuentas/"+correo).get(); const c=d.exists?d.data():null;
  if(!c){ const r=await db.doc("registros/"+correo).get(); if(r.exists) throw uerr("Tu registro todavía está pendiente. El administrador debe aprobarlo antes de que puedas entrar."); }
  const ok = c ? (await derivar(clave,c.salt,c.iteraciones||ITER))===c.hash : false;
  if(!ok){ const n=(it.fallidos||0)+1, bloq=n>=MAX_INTENTOS; try{ await iRef.set({fallidos:bloq?0:n,bloqueado_hasta:bloq?new Date(Date.now()+BLOQUEO_MIN*60000).toISOString():null}); }catch(_){} await registrarAcceso(bloq?"BLOQUEO":"FALLIDO",correo);
    throw uerr(bloq?`Correo o contraseña incorrectos. Por seguridad el acceso queda bloqueado ${BLOQUEO_MIN} minutos.`:`Correo o contraseña incorrectos. Te quedan ${MAX_INTENTOS-n} intento(s).`); }
  if(c.estado!=="ACTIVA") throw uerr("Tu cuenta está desactivada. Comunícate con la administración.");
  try{ await iRef.set({fallidos:0,bloqueado_hasta:null}); }catch(_){}
  const upd={...c,ultimo_acceso:nowISO()}; try{ await db.doc("cuentas/"+correo).set(upd); }catch(_){}
  entrar({id:correo,...upd}); await registrarAcceso("INICIO"); render(); toast(`Bienvenido, ${upd.nombre.split(" ")[0].charAt(0)+upd.nombre.split(" ")[0].slice(1).toLowerCase()}.`);
}
async function enviarRegistro(F){
  const nombre=F.nombre.value.trim().replace(/\s+/g," ").toUpperCase(), correo=normCorreo(F.correo.value), tel=F.telefono.value.replace(/\D/g,""), rolS=F.rol.value;
  const anillo=rolS==="residente"?Number(F.anillo.value):null, apto=rolS==="residente"?F.apto.value.trim().toUpperCase():null;
  if(nombre.length<5 || !nombre.includes(" ")) throw uerr("Escribe tu nombre completo (nombre y apellido).");
  if(!correoValido(correo)) throw uerr("El correo no es válido.");
  if(tel && !telValido(tel)) throw uerr("El teléfono debe tener 10 dígitos y empezar por 3.");
  if(rolS==="residente" && !apto) throw uerr("Escribe tu número de apartamento.");
  if(!claveValida(F.p1.value)) throw uerr("La contraseña debe tener mínimo 8 caracteres, con al menos una letra y un número.");
  if(F.p1.value!==F.p2.value) throw uerr("Las contraseñas no coinciden.");
  if(!F.hd.checked) throw uerr("Debes aceptar el tratamiento de datos para registrarte.");
  if((await db.doc("cuentas/"+correo).get()).exists) throw uerr("Ya existe una cuenta con ese correo. Inicia sesión o pide al administrador que restablezca tu contraseña.");
  if((await db.doc("registros/"+correo).get()).exists) throw uerr("Ya hay un registro pendiente con ese correo.");
  const h=await hashNuevo(F.p1.value);
  const primera=(await db.collection("cuentas").limit(1).get()).empty;
  if(primera){
    const c={nombre,correo,telefono:tel,rol:"administrador",anillo:null,apto:null,estado:"ACTIVA",...h,debe_cambiar:false,fecha_creacion:nowISO(),creado_por:"registro",ultimo_acceso:nowISO()};
    await db.doc("cuentas/"+correo).set(c); entrar({id:correo,...c}); await registrarAcceso("REGISTRO"); render(); toast("Cuenta creada. Como eres el primer usuario, quedaste como administrador."); return;
  }
  await db.doc("registros/"+correo).set({nombre,correo,telefono:tel,rol_solicitado:rolS,anillo,apto,...h,fecha:nowISO()});
  await registrarAcceso("SOLICITUD",correo);
  S.auth.estado="login"; S.auth.info="Tu registro quedó enviado. Podrás entrar cuando el administrador lo apruebe."; render();
}
async function cambiarObligatorio(F){
  if(!claveValida(F.p1.value)) throw uerr("La contraseña debe tener mínimo 8 caracteres, con al menos una letra y un número.");
  if(F.p1.value!==F.p2.value) throw uerr("Las contraseñas no coinciden.");
  const c={...limpio(S.auth.cuenta),...(await hashNuevo(F.p1.value)),debe_cambiar:false};
  await db.doc("cuentas/"+S.auth.cuenta.id).set(c); await registrarAcceso("CAMBIO_CLAVE");
  entrar({id:S.auth.cuenta.id,...c}); render(); toast("Contraseña guardada.");
}

/* ---------- Gráficas SVG ---------- */
const SERIES=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)"];
function donut(data, titulo){
  const tot=data.reduce((s,d)=>s+d.v,0); const R=52, C=2*Math.PI*R; let off=0;
  const arcs = tot ? data.filter(d=>d.v>0).map((d,i)=>{ const len=d.v/tot*C; const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${d.c||SERIES[i%5]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(d.l)}: ${d.v}</title></circle>`; off+=len; return s; }).join("") : `<circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="22"/>`;
  return `<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${esc(titulo)}">${arcs}<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">${tot}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="var(--muted)">total</text></svg><div class="chart-legend" style="flex-direction:column">${data.map((d,i)=>`<span><i style="background:${d.c||SERIES[i%5]}"></i>${esc(d.l)}: <b>${d.v}</b> <span class="muted">(${pct(d.v,tot)}%)</span></span>`).join("")}</div></div>`;
}
function barras(rows, max){ max = max || Math.max(1,...rows.map(r=>r.v)); return `<div class="bars">${rows.map((r,i)=>`<div class="row"><span>${esc(r.l)}</span><div class="track"><div style="width:${Math.min(100,r.v/max*100)}%;background:${r.c||SERIES[1]}"></div></div><b class="num">${r.v}${r.suf||""}</b></div>`).join("")}</div>`; }
function columnas(meses, series){ // series: [{n, c, vals[]}]
  const W=520,H=190,pad=28; const max=Math.max(1,...meses.map((_,i)=>series.reduce((s,se)=>s+se.vals[i],0)));
  const bw=(W-pad*2)/meses.length*0.6;
  let out=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="Movimientos por mes">`;
  [0,.5,1].forEach(t=>{ const y=H-(H-20)*t; out+=`<line x1="${pad}" x2="${W-8}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(max*t)}</text>`; });
  meses.forEach((m,i)=>{ const x=pad+(W-pad*2)/meses.length*(i+.2); let y=H; series.forEach(se=>{ const h=se.vals[i]/max*(H-20); y-=h; if(h>0) out+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${se.c}"><title>${esc(se.n)}: ${se.vals[i]}</title></rect>`; }); out+=`<text x="${x+bw/2}" y="${H+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(fmtPeriodo(m))}</text>`; });
  return out+`</svg><div class="chart-legend">${series.map(se=>`<span><i style="background:${se.c}"></i>${esc(se.n)}</span>`).join("")}</div>`;
}

function abrirFormCupo(c, pre){
  openModal(formCupo(c,pre), m=>{
    const F=m.querySelector("#fc"); const auto=m.querySelector("#fc-auto");
    m.querySelector("[data-close]").onclick=closeModal;
    const revisarApto=()=>{
      if(c && c.id) return;
      const an=F.anillo.value, ap=F.apto.value.trim().toUpperCase(); const otros=activos().filter(x=>String(x.anillo)===an && String(x.apto).toUpperCase()===ap);
      const tipoSel=F.tipo_cupo;
      if(ap && otros.length){ const base=otros.find(x=>x.tipo_cupo==="FIJO")||otros[0];
        ["nombre","tipo_identificacion","numero_identificacion","tipo_tenencia","telefono","correo"].forEach(k=>{ if(F[k]) F[k].value=base[k]||""; });
        [...tipoSel.options].forEach(o=>o.disabled=o.value==="FIJO"); if(tipoSel.value==="FIJO") tipoSel.value="SEGUNDO CUPO";
        auto.hidden=false; auto.innerHTML=`Este apartamento ya tiene ${otros.length} cupo(s) activo(s) (${otros.map(x=>x.placa).join(", ")}). Se copiaron los datos del responsable; solo falta la placa nueva y el tipo. Un apartamento no puede tener dos cupos fijos.`;
      } else { [...tipoSel.options].forEach(o=>o.disabled=o.value==="SEGUNDO CUPO"); if(tipoSel.value==="SEGUNDO CUPO") tipoSel.value="FIJO"; auto.hidden=true; }
    };
    F.anillo.addEventListener("change",revisarApto); F.apto.addEventListener("change",revisarApto); F.apto.addEventListener("blur",revisarApto);
    if(!c || !c.id) revisarApto();
    const scan=m.querySelector("#fc-scan"); if(scan) scan.onchange=async ()=>{ const file=scan.files[0]; if(!file) return; const msg=m.querySelector("#fc-scanmsg"); msg.textContent="Leyendo la placa…"; try{ const r=await leerPlaca(file); if(r.placa){ F.placa.value=r.placa; msg.textContent=`Placa leída (confianza ${Math.round(r.confianza*100)}%). Revísala antes de guardar.`; } else msg.textContent="No se pudo leer la placa. Escríbela a mano."; }catch(e){ msg.textContent=sampleErr(e)+" Escríbela a mano."; } scan.value=""; };
    m.querySelector("#fc-save").onclick=async ()=>{ const b=m.querySelector("#fc-save"); b.disabled=true; m.querySelector("#fc-err").textContent=""; try{ await guardarCupo(F, c, m); closeModal(); toast(c&&c.id?"Cambios guardados.":"Vehículo registrado."); }catch(e){ m.querySelector("#fc-err").textContent=e.userMsg||errMsg(e); b.disabled=false; } };
  });
}
async function guardarCupo(F, orig, m){
  const g=k=>(F[k]?F[k].value:"").trim();
  const placa=normPlaca(g("placa")); const tipo=g("tipo_cupo"); const anillo=Number(g("anillo")); const apto=g("apto").toUpperCase();
  if(!formatoPlaca(placa)) throw uerr("La placa no tiene un formato válido. Carro: ABC123. Moto: ABC12D o ABC12.");
  const dup=S.cupos.find(c=>c.estado==="ACTIVO" && c.placa===placa && c.id!==orig?.id);
  if(dup) throw uerr(`La placa ${placa} ya está activa en el anillo ${dup.anillo}, apto ${dup.apto}.`);
  if(!anillosCfg().find(a=>a.anillo===anillo)) throw uerr("Ese anillo no existe en la configuración.");
  if(!apto) throw uerr("Escribe el número de apartamento.");
  if(!g("nombre")) throw uerr("Escribe el nombre del responsable.");
  if(g("telefono") && !telValido(g("telefono"))) throw uerr("El teléfono debe tener 10 dígitos y empezar por 3.");
  if(g("correo") && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g("correo"))) throw uerr("El correo no parece válido.");
  const estado = orig?.id ? g("estado") : "ACTIVO";
  const otros=activos().filter(c=>c.anillo===anillo && String(c.apto).toUpperCase()===apto && c.id!==orig?.id);
  if(estado==="ACTIVO"){
    if(tipo==="FIJO" && otros.some(c=>c.tipo_cupo==="FIJO")) throw uerr("Este apartamento ya tiene un cupo FIJO. Registra este vehículo como SEGUNDO CUPO o ROTATIVO.");
    if(tipo==="SEGUNDO CUPO" && !otros.length) throw uerr("El primer cupo de un apartamento debe ser FIJO.");
    if(otros.length+1 > Number(S.config.max_cupos_por_apto)) throw uerr(`Un apartamento no puede tener más de ${S.config.max_cupos_por_apto} cupos activos.`);
    if(tipo==="ROTATIVO" && (!orig || orig.tipo_cupo!=="ROTATIVO" || orig.estado!=="ACTIVO")){ const usados=activos().filter(c=>c.tipo_cupo==="ROTATIVO").length; if(usados>=Number(S.config.total_cupos_rotativos)) throw uerr("No quedan cupos rotativos libres. Usa la cola de turnos."); }
  }
  let justExceso="";
  const esNuevoFijo = estado==="ACTIVO" && tipo==="FIJO" && (!orig || orig.tipo_cupo!=="FIJO" || orig.anillo!==anillo || orig.estado!=="ACTIVO");
  if(esNuevoFijo){ const H=hamilton()[anillo]; if(H && asignadosAnillo(anillo)>=H.equitativo){ m.querySelector("#fc-exceso").hidden=false; justExceso=g("just_exceso"); if(justExceso.length<5) throw uerr("El anillo "+anillo+" ya tiene "+asignadosAnillo(anillo)+" de "+H.equitativo+" cupos equitativos. Escribe una justificación para continuar."); } }
  const data={ anillo, apto, placa, nombre:g("nombre").toUpperCase(), tipo_identificacion:g("tipo_identificacion"), numero_identificacion:g("numero_identificacion"), tipo_tenencia:g("tipo_tenencia"), tipo_cupo:tipo, correo:g("correo").toLowerCase(), telefono:g("telefono"), estado, cuota_mensual:cuotaDe(tipo), comentarios:g("comentarios"),
    ultimo_periodo_pagado:orig?.ultimo_periodo_pagado||null, fecha_ultimo_pago:orig?.fecha_ultimo_pago||null, fecha_registro:orig?.fecha_registro||nowISO(), fecha_eliminacion:orig?.fecha_eliminacion||null,
    user_id: orig?.user_id || (otros.find(o=>o.user_id)?.user_id ?? null) };
  if(orig && orig.id){
    await db.doc("cupos/"+orig.id).set(data);
    await logMov("EDITAR",{id:orig.id,...data}, [g("motivo"),justExceso].filter(Boolean).join(" · "), limpio(orig), data);
  } else {
    const ref=db.collection("cupos").doc(); await ref.set(data);
    await logMov("CREAR",{id:ref.id,...data}, justExceso, null, data, justExceso?"Cupo fijo por encima del reparto equitativo":"");
  }
}

function sampleErr(e){ const c=e&&e.code; if(c==="not_granted") return "No se autorizó el uso de la IA."; if(c==="rate_limited") return "Se alcanzó el límite de uso de la IA. Intenta en unos minutos."; if(c==="image_rejected") return "La imagen no se pudo procesar. Prueba con otra foto."; if(c==="images_unavailable"||c==="sampling_disabled") return "La lectura con IA no está disponible aquí."; if(c==="cancelled") return "Lectura cancelada."; return "La IA no respondió."; }
async function comprimir(file){
  try{ const bmp=await createImageBitmap(file); const s=Math.min(1,1280/Math.max(bmp.width,bmp.height)); const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s); cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height); return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",0.85)); }catch(_){ return file; }
}

function cruzar(placa){

const CAM={stream:null,devices:[],idx:0};
function stopCamara(){ if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; } }
document.addEventListener("visibilitychange",()=>{ if(document.hidden && CAM.stream) closeModal(); });
function camErrorTexto(e){
  const n=e&&e.name;
  if(n==="NotAllowedError"||n==="PermissionDeniedError") return "No se dio permiso para usar la cámara. Actívalo en el navegador (ícono del candado junto a la dirección) o usa «Foto con la app de cámara».";
  if(n==="NotFoundError"||n==="OverconstrainedError"||n==="DevicesNotFoundError") return "No se encontró ninguna cámara en este equipo. Usa «Subir imagen».";
  if(n==="NotReadableError"||n==="TrackStartError") return "La cámara está siendo usada por otra aplicación. Ciérrala e inténtalo de nuevo.";
  return "Este navegador no permite abrir la cámara dentro de la página. Usa «Foto con la app de cámara» (en celular abre la cámara directamente).";
}
async function iniciarStream(m, deviceId){
  stopCamara();
  const v=m.querySelector("#cam-v");
  const video = deviceId ? {deviceId:{exact:deviceId},width:{ideal:1920},height:{ideal:1080}} : {facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}};
  CAM.stream=await navigator.mediaDevices.getUserMedia({video,audio:false});
  v.srcObject=CAM.stream; try{ await v.play(); }catch(_){}
}
function abrirCamara(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ toast(camErrorTexto(null),"error"); return; }
  openModal(`<h2>Escanear placa</h2><p class="muted small" style="margin:4px 0 12px">Centra la placa dentro del recuadro amarillo y pulsa Capturar. Mejor con buena luz y sin reflejos.</p><div class="cam" id="cam-box"><video id="cam-v" autoplay playsinline muted></video><div class="cam-guia" aria-hidden="true"></div><div class="cam-msg" id="cam-msg">Encendiendo la cámara…</div></div><div class="err" id="cam-err"></div><div class="foot"><button class="btn" data-close>Cerrar</button><button class="btn" id="cam-sw" hidden>Cambiar cámara</button><button class="btn primary big" id="cam-cap" disabled>Capturar</button></div>`, async m=>{
    m.querySelector("[data-close]").onclick=closeModal;
    const cap=m.querySelector("#cam-cap"), sw=m.querySelector("#cam-sw"), msg=m.querySelector("#cam-msg"), err=m.querySelector("#cam-err");
    try{
      await iniciarStream(m, null);
      msg.textContent=""; cap.disabled=false; cap.focus();
      try{ CAM.devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput"); const cur=CAM.stream&&CAM.stream.getVideoTracks()[0].getSettings().deviceId; CAM.idx=Math.max(0,CAM.devices.findIndex(d=>d.deviceId===cur)); sw.hidden=CAM.devices.length<2; }catch(_){}
    }catch(e){ msg.textContent=""; err.innerHTML=esc(camErrorTexto(e))+` <label class="btn sm" style="margin-top:8px">Foto con la app de cámara<input type="file" accept="image/*" capture="environment" class="sr" id="cam-fb"></label>`;
      const fb=m.querySelector("#cam-fb"); if(fb) fb.onchange=()=>{ const f=fb.files[0]; if(f){ closeModal(); usarImagen(f); } }; return; }

    cap.onclick=async ()=>{
      const v=m.querySelector("#cam-v"); const vw=v.videoWidth, vh=v.videoHeight; if(!vw||!vh){ err.textContent="La cámara aún no está lista. Espera un segundo e inténtalo de nuevo."; return; }
      const gw=vw*0.85, gh=gw/2.2; const cw=Math.min(vw,gw*1.15), ch=Math.min(vh,gh*1.6); const sx=(vw-cw)/2, sy=(vh-ch)/2;
      const k=Math.min(1,1280/cw); const cv=document.createElement("canvas"); cv.width=Math.round(cw*k); cv.height=Math.round(ch*k);

/* ---------- Turnos rotativos ---------- */
function ultimoUsoRotativo(anillo, apto){
  const fechas=[];
  S.cupos.filter(c=>c.anillo==anillo && c.apto==apto && c.tipo_cupo==="ROTATIVO").forEach(c=>{ if(c.estado==="ACTIVO") fechas.push("ACTIVO"); if(c.fecha_eliminacion) fechas.push(c.fecha_eliminacion); });
  S.solicitudes.filter(s=>s.anillo==anillo && s.apto==apto && s.estado==="ASIGNADO" && s.fecha_asignacion).forEach(s=>fechas.push(s.fecha_asignacion));
  const idsRot=new Set(S.cupos.filter(c=>c.anillo==anillo && c.apto==apto && c.tipo_cupo==="ROTATIVO").map(c=>c.id));
  S.lecturas.filter(l=>l.cupo_id && idsRot.has(l.cupo_id)).forEach(l=>fechas.push(l.fecha));
  if(fechas.includes("ACTIVO")) return "ACTIVO";
  return fechas.sort().pop()||null;
}
function colaTurnos(){
  return S.solicitudes.filter(s=>s.estado==="EN_ESPERA").map(s=>({...s,ultimo:ultimoUsoRotativo(s.anillo,s.apto)})).sort((a,b)=>{
    const rank=x=>x.ultimo==="ACTIVO"?2:x.ultimo?1:0; if(rank(a)!==rank(b)) return rank(a)-rank(b);
    if(a.ultimo && b.ultimo && a.ultimo!=="ACTIVO" && a.ultimo!==b.ultimo) return a.ultimo.localeCompare(b.ultimo);
    return (a.fecha_solicitud||"").localeCompare(b.fecha_solicitud||"");
  });
}

/* ---------- Alertas ---------- */
const REGLAS={VISITANTE_RECURRENTE:"Visitante recurrente",CUPOS_DE_MAS:"Cupos de más",ELIMINAR_Y_RECREAR:"Eliminar y recrear",MORA_CON_INGRESO:"Mora con ingreso"};
function detectar(){
  const C=S.config, out=[];
  const vis={}; S.visitas.filter(v=>diasDesde(v.fecha_ingreso)<=30).forEach(v=>(vis[v.placa]=vis[v.placa]||[]).push(v));
  Object.entries(vis).forEach(([p,a])=>{ if(a.length>Number(C.umbral_visitas_30d)) out.push({tipo_regla:"VISITANTE_RECURRENTE",clave:"V-"+p,placa:p,cupo_id:null,detalle:`La placa ${p} entró ${a.length} veces como visitante en los últimos 30 días (límite ${C.umbral_visitas_30d}). Puede ser un cupo fijo disfrazado.`}); });
  aptosMulti().filter(g=>g.length>Number(C.max_cupos_por_apto)).forEach(g=>out.push({tipo_regla:"CUPOS_DE_MAS",clave:"A-"+aptoKey(g[0]),placa:g.map(c=>c.placa).join(", "),cupo_id:g[0].id,detalle:`El anillo ${g[0].anillo}, apto ${g[0].apto} tiene ${g.length} cupos activos; el máximo es ${C.max_cupos_por_apto}.`}));
  S.cupos.filter(c=>c.estado==="ELIMINADO" && c.fecha_eliminacion).forEach(e=>{ const r=S.cupos.find(n=>n.id!==e.id && n.placa===e.placa && n.fecha_registro>=e.fecha_eliminacion && (new Date(n.fecha_registro)-new Date(e.fecha_eliminacion))/86400000 < Number(C.umbral_recrear_dias)); if(r) out.push({tipo_regla:"ELIMINAR_Y_RECREAR",clave:"R-"+r.id,placa:e.placa,cupo_id:r.id,detalle:`La placa ${e.placa} se eliminó el ${fmtFecha(e.fecha_eliminacion)} y se volvió a crear el ${fmtFecha(r.fecha_registro)}, en menos de ${C.umbral_recrear_dias} días.`}); });
  activos().filter(c=>estadoPago(c)==="MOROSO").forEach(c=>{ const l=S.lecturas.filter(x=>x.placa_confirmada===c.placa && diasDesde(x.fecha)<=Number(C.umbral_mora_ingreso_dias)); if(l.length) out.push({tipo_regla:"MORA_CON_INGRESO",clave:"M-"+c.id+"-"+periodoActual(),placa:c.placa,cupo_id:c.id,detalle:`La placa ${c.placa} está en mora (${money(deuda(c).valor)}) y registró ${l.length} ingreso(s) en los últimos ${C.umbral_mora_ingreso_dias} días.`}); });
  return out;
}

function parseCSV(txt){

    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){ row.push(cell); cell=""; } else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&txt[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=ch; }

  return {sep, rows:rows.filter(r=>r.some(c=>c.trim()))};

  eliminar:d=>{ const c=S.cupos.find(c=>c.id===d.id); confirmar("Eliminar cupo", `Se marcará como eliminado el cupo de la placa <b>${esc(c.placa)}</b> (anillo ${c.anillo}, apto ${esc(c.apto)}). No se borra: queda en el historial.`, "Eliminar cupo", async j=>{ const antes=limpio(c); const dd={...antes,estado:"ELIMINADO",fecha_eliminacion:nowISO()}; await db.doc("cupos/"+c.id).set(dd); await logMov("ELIMINAR",c,j,antes,dd); toast("Cupo eliminado."); }, {justificacion:true,peligro:true}); },
  "esc-leer":()=>escLeer(),
  "cam-abrir":()=>abrirCamara(),
  "esc-confirmar":()=>escConfirmar($("#esc-conf").value,false),
  "esc-manual":()=>{ ESC.manual=true; escConfirmar($("#esc-man").value,true); },
  "esc-reset":()=>{ if(ESC.url) URL.revokeObjectURL(ESC.url); Object.assign(ESC,{file:null,url:null,res:null,cruce:null,err:""}); render(); },
  "visita-nueva":d=>abrirVisita(d.placa),
  "visita-salida":async d=>{ const v=S.visitas.find(x=>x.id===d.id); try{ await db.doc("visitas/"+v.id).set({...limpio(v),fecha_salida:nowISO()}); }catch(e){ toast(errMsg(e),"error"); } },
  "sol-nueva":()=>abrirSolicitud(),
  "sol-cancelar":d=>{ const s=S.solicitudes.find(x=>x.id===d.id); confirmar("Cancelar solicitud",`Se cancelará la solicitud del anillo ${s.anillo}, apto ${esc(s.apto)}.`,"Cancelar solicitud",async ()=>{ await db.doc("solicitudes/"+s.id).set({...limpio(s),estado:"CANCELADO"}); },{peligro:true}); },
  asignar:d=>{ const s=colaTurnos().find(x=>x.id===d.id); if(Number(d.pos)===0) confirmar("Asignar turno",`Se creará un cupo rotativo para ${plate(s.placa)} (anillo ${s.anillo}, apto ${esc(s.apto)}). ${esc(porQue(s))}.`,"Asignar turno",async ()=>{ await asignarTurno(s,""); toast("Turno asignado."); });
    else confirmar("Asignar fuera de turno",`Esta solicitud está en el puesto ${Number(d.pos)+1} de la cola. Para saltarte el orden, explica por qué; quedará en el historial.`,"Asignar turno",async j=>{ await asignarTurno(s,j); toast("Turno asignado."); },{justificacion:true}); },
  pago:d=>abrirPago(S.cupos.find(c=>c.id===d.id)),
  "recordar-morosos":()=>abrirRecordarMorosos(),
  notif:d=>{ const c=S.cupos.find(x=>x.id===d.id); db.collection("notificaciones").doc().set({cupo_id:c.id,canal:d.canal,motivo:d.motivo,mensaje:mensaje(c,d.motivo),enviado_por:S.me.id,fecha:nowISO()}).then(()=>logMov("NOTIFICAR",c,"",null,null,`${d.canal==="WHATSAPP"?"WhatsApp":"Correo"}: ${d.motivo==="MORA"?"aviso de mora":"recordatorio de pago"}`)).catch(()=>{}); return "keep"; },
  analizar:async ()=>{ try{ await analizar(false); }catch(e){ toast(errMsg(e),"error"); } },
  alerta:d=>{ const a=S.alertas.find(x=>x.id===d.id); confirmar(d.e==="REVISADA"?"Marcar como revisada":"Descartar alerta", esc(a.detalle), d.e==="REVISADA"?"Marcar como revisada":"Descartar", async j=>{ await db.doc("alertas/"+a.id).set({...limpio(a),estado:d.e,comentario_revision:j,revisado_por:S.me.id,fecha_revision:nowISO()}); }, {justificacion:true}); },
  "csv-exportar":()=>exportarCSV(),
  word:()=>reporteWord().catch(()=>toast("No se pudo generar el reporte.","error")),
  dedup:()=>confirmar("Eliminar duplicados",`Se conservará el registro más reciente de cada placa repetida y los demás se marcarán como eliminados.`,"Eliminar duplicados",async ()=>{ await dedup(); },{peligro:true}),
  "cfg-guardar":async ()=>{ try{ await guardarConfig(); }catch(e){ toast(errMsg(e),"error"); } },
  salir:async ()=>{ await registrarAcceso("CIERRE"); cerrarSesion("Cerraste sesión."); },
  "cambiar-clave":()=>abrirCambioClave(),
  "us-nuevo":()=>abrirUsuario(null),
  "us-editar":d=>abrirUsuario(S.cuentas.find(c=>c.id===d.id)),
  "us-reset":d=>{ const c=S.cuentas.find(x=>x.id===d.id); confirmar("Restablecer contraseña",`Se generará una contraseña temporal para <b>${esc(c.nombre)}</b>. Al entrar tendrá que crear una nueva.`,"Restablecer",async ()=>{ const t=claveTemporal(); const nc={...limpio(c),...(await hashNuevo(t)),debe_cambiar:true}; await db.doc("cuentas/"+c.id).set(nc); try{ await db.doc("intentos/"+c.id).set({fallidos:0,bloqueado_hasta:null}); }catch(_){} await registrarAcceso("RESTABLECER",c.id); setTimeout(()=>mostrarCredenciales("Contraseña restablecida",c.correo,t),0); }); },
  "us-estado":d=>{ const c=S.cuentas.find(x=>x.id===d.id); const act=c.estado==="ACTIVA"; confirmar(act?"Desactivar cuenta":"Activar cuenta", act?`${esc(c.nombre)} no podrá entrar hasta que reactives la cuenta.`:`${esc(c.nombre)} podrá volver a entrar.`, act?"Desactivar":"Activar", async ()=>{ await db.doc("cuentas/"+c.id).set({...limpio(c),estado:act?"INACTIVA":"ACTIVA"}); await registrarAcceso(act?"DESACTIVADO":"ACTIVADO",c.id); },{peligro:act}); },
  "reg-aprobar":async (d,b)=>{ const rolN=b.closest("tr").querySelector(".rol-sel").value; b.disabled=true; try{ await aprobarRegistro(d.id,rolN); toast("Registro aprobado. La persona ya puede entrar."); }catch(e){ toast(e.userMsg||errMsg(e),"error"); b.disabled=false; } },
  "reg-rechazar":d=>confirmar("Rechazar registro","Se borrará la solicitud. La persona podrá registrarse de nuevo si lo necesita.","Rechazar",async ()=>{ await db.doc("registros/"+d.id).delete(); await registrarAcceso("RECHAZADO",d.id); },{peligro:true}),
};
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b||b.disabled) return; const fn=ACT[b.dataset.act]; if(!fn) return; const r=fn(b.dataset,b,e); if(r!=="keep" && b.tagName==="A") e.preventDefault(); });
document.addEventListener("input",e=>{ const t=e.target; if(t.dataset && t.dataset.f && t.type==="text"){ S.f[t.dataset.f]=t.value; S.page={}; render(); } });
document.addEventListener("change",e=>{ const t=e.target;
  if(t.dataset && t.dataset.f && t.type!=="text"){ S.f[t.dataset.f]= t.type==="checkbox"?t.checked:t.value; S.page={}; render(); }
  if(t.id==="csv-in" && t.files[0]){ importarCSV(t.files[0]).catch(()=>{ $("#csv-res").textContent="No se pudo leer el archivo."; }); t.value=""; }
});

/* ================= Arranque ================= */
try{ const t=localStorage.getItem("parkapp-tema"); if(t) document.documentElement.dataset.theme=t; }catch(_){}
render();
(async ()=>{
  if(!window.claude || !window.claude.use){ render(); return; }
  const [d,u,s,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample"),claude.use("downloads")]);
  db=d; user=u; sample=s; downloads=dl;
  if(user){ try{ S.me.isOwner=await user.isOwner(); S.me.id=await user.id(); }catch(_){} }
  if(sample){ try{ const lim=await sample.limits(); sampleImages=!!(lim&&lim.images); }catch(_){ sampleImages=false; } }
  if(!db){ render(); return; }
  COLS.forEach(n=>db.collection(n).onSnapshot(snap=>{ S[n]=snap.docs.map(x=>({id:x.id,...x.data()})); S.loaded.add(n); schedule(); }, err=>{ S.loaded.add(n); schedule(); }));
  db.doc("config/general").onSnapshot(snap=>{ S.config = snap.exists ? {...DEF,...snap.data()} : {...DEF}; schedule(); }, ()=>{});
  render();
  await cargarAuth();
  render();
})();
let autoHecho=false;
function autoAnalisis(){
  if(autoHecho || S.auth.estado!=="ok" || rolReal()!=="administrador" || S.loaded.size<COLS.length) return;
  const u=S.config.ultimo_analisis; if(u && new Intl.DateTimeFormat("en-CA",{timeZone:"America/Bogota"}).format(new Date(u))===hoyBogota()) { autoHecho=true; return; }
  autoHecho=true; setTimeout(()=>analizar(true).catch(()=>{}), 1500);
}
</script>
